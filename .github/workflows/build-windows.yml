---
name: Build - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=$(echo ${GITHUB_SHA} | cut -c1-6)
          echo "CI_VERSION=${CI_VERSION}" >> $GITHUB_ENV

      - name: Download dependencies (Windows)
        run: powershell ./setup-deps.ps1

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools

      - name: Add Vulkan to PATH
        shell: pwsh
        run: |
          Write-Host "Raw VULKAN_SDK: $env:VULKAN_SDK"
          $vpath = $env:VULKAN_SDK
          if ($vpath -match '^/([a-zA-Z])/(.*)') {
            $drive = $Matches[1].ToUpper()
            $rest = $Matches[2].Replace('/', '\')
            $vpath = "$drive`:\$rest"
          }
          if (-not (Test-Path $vpath)) {
            $vpath = "$env:GITHUB_WORKSPACE\vulkan_sdk"
          }
          Write-Host "Resolved VULKAN_SDK: $vpath"
          $vpathForward = $vpath.Replace('\', '/')
          "VULKAN_SDK=$vpathForward" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          foreach ($cand in @("$vpath\Bin", "$vpath\bin")) {
            if (Test-Path $cand) {
              Write-Host "Adding to GITHUB_PATH: $cand"
              $cand | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          $glslang = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "glslangValidator.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($glslang) {
            Write-Host "Found glslangValidator.exe at $($glslang.FullName)"
            $glslangDir = $glslang.DirectoryName
            $glslangDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $glslangParent = (Split-Path $glslangDir -Parent).Replace('\', '/')
            "VULKAN_SDK=$glslangParent" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $vulkanLib = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "vulkan-1.lib" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vulkanLib) {
            Write-Host "Found vulkan-1.lib at $($vulkanLib.FullName)"
            $targetDir = "$env:GITHUB_WORKSPACE\libs\windows\lib\x64"
            if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
            }
            Copy-Item -Path $vulkanLib.FullName -Destination $targetDir -Force
            Write-Host "Copied vulkan-1.lib to $targetDir"
          } else {
            Write-Warning "vulkan-1.lib not found in workspace search!"
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: 6.11.1
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Build x64 binaries (Windows)
        shell: cmd
        run: |
          where glslangValidator.exe || echo glslangValidator.exe not in PATH
          set "PATH=%QT_PATH%;%VULKAN_SDK%\bin;%VULKAN_SDK%\Bin;%PATH%"
          set "LIB=%VULKAN_SDK%\Lib;%VULKAN_SDK%\lib;%GITHUB_WORKSPACE%\libs\windows\lib\x64;%LIB%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\6.11.1\msvc2022_64\bin

      - name: Upload Binaries (Windows x64)
        uses: actions/upload-artifact@v6
        with:
          name: Aurora-Windows-x64-${{ env.CI_VERSION }}
          path: build/deploy-x64-release/*
          if-no-files-found: error
